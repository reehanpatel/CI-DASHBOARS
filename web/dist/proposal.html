<!DOCTYPE html>

<title>CI360 — Client Proposal Review</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
body {
  margin: 0;
  background: var(--bg-base);
  color: var(--text-1);
  font-family: var(--font-sans);
}
.client-view-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}
.client-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: #0F2A4A;
  color: #FFFFFF;
}
.client-brand {
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: 700;
  color: #D4A657;
}
.client-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 24px;
  align-items: start;
  margin-top: 24px;
}
@media (max-width: 960px) {
  .client-split {
    grid-template-columns: 1fr;
  }
}
.respond-card {
  position: sticky;
  top: 24px;
}
</style>
